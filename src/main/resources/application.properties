spring.application.name=AGRITECH

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS - allow the React/Vite frontend to call the API directly
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/AGRITECHdb
spring.datasource.username=postgres
spring.datasource.password=123

# Let Spring Boot detect the driver automatically
# spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SpringBootHikariCP

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON serialization
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# File uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/learning

# AI Advisor
# provider: gemini (Google, free tier via AI Studio) or openai (any OpenAI-compatible endpoint)
# To enable real AI answers, put your key in app.ai.api-key and restart.
app.ai.provider=gemini
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
app.ai.api-key=AQ.Ab8RN6IJ0WvuzZslC4ow5xWWIWLqv110_J8y8GSyS5tH5ZYuTA
app.ai.default-model=gemini-3.6-flash
app.ai.selectable-models=gemini-3.6-flash
app.ai.max-tokens=600
app.ai.timeout-seconds=60
app.ai.system-prompt=You are the AgriConnect farming advisor. Give clear, practical, and concise advice about crops, soil, irrigation, pests, livestock, and agricultural markets. If unsure, say so and suggest consulting a local agronomist.

# Email (SMTP) - used for the password reset OTP flow.
# Leave username/password empty to skip real sending; the code is then logged to the console.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=

# SMS gateway - used to send real text messages from the chat page.
# Provider: Africa's Talking (https://africastalking.com)
# To go live: set sms.gateway.api-key (and sms.gateway.username, optional sms.gateway.from).
# Leave api-key empty to keep simulating (messages are logged to the console and stored in the DB).
sms.gateway.url=https://api.africastalking.com/version1/messaging
sms.gateway.api-key=
sms.gateway.username=
sms.gateway.from=

# Payment gateway - mobile money deposits and payouts (M-Pesa, Tigo Pesa, Airtel Money, Halopesa).
# Runs in sandbox mode: payments start PENDING and complete only when confirmed
# (POST /api/wallet/payments/{reference}/confirm) - the equivalent of the user approving on their phone.
# A real provider adapter can be plugged into PaymentServiceImpl later without changing the API.
payment.gateway.sandbox=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=INFO

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true